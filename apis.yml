name: Spike
description: >-
  Spike is an AI-powered email and team collaboration platform that turns
  standard email accounts (Gmail, Outlook, IMAP) into a chat-like, conversational
  experience. Its consumer Email App reformats existing inboxes into threaded
  conversations, while Spike Teamspace is an end-to-end email and team-chat
  service with shared inboxes, channels, groups, collaborative docs, tasks, notes,
  and built-in video meetings. Spike layers AI features across the inbox for smart
  prioritization, thread summaries, and draft assistance. The company is a
  portfolio company of Insight Partners. As of this enrichment pass Spike ships
  consumer and team applications but publishes no public developer API, OpenAPI
  specification, or developer portal; the profile below captures its real product,
  security posture, and public link surface.
